<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Academic Projects · Arthur Buis</title>
<meta name="description" content="Academic projects by Arthur Buis, computer vision, LLMs, graphs and optimisation.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=27">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="page-hero">
  <div class="hero-bg"></div>
  <div class="page-hero-in">
    <h1 id="pr-title"></h1>
    <p id="pr-sub"></p>
  </div>
</div>
<div class="page-container projects-list" id="plist"></div>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js?v=35"></script>
<script src="assets/js/site.js?v=15"></script>
<script>

function paintPage(){
  document.title = t({fr:"Projets académiques",en:"Academic Projects"}) + " · " + DATA.name;
  $("pr-title").textContent = t({fr:"Projets académiques",en:"Academic Projects"});
  $("pr-sub").textContent   = t({fr:"Projets de recherche appliquée menés à l'École Polytechnique et en classe préparatoire.",
                            en:"Applied research projects carried out at École Polytechnique and in classe préparatoire."});

  $("plist").innerHTML = `<ul>${DATA.projects.map(p=>`
      <li><a class="project-row" href="${p.slug}.html">
        <div class="project-row-body">
          <h3>${t(p.title)}</h3>
          <span class="when">${t(p.when)}</span>
          <p>${t(p.listSummary || p.summary)}</p>
        </div>
        <span class="go">&rarr;</span>
      </a></li>`).join("")}</ul>`;
}

</script>
</body>
</html>
