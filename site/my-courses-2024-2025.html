<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses 2024-2025 · Arthur Buis</title>
<meta name="description" content="Courses followed by Arthur Buis in 2024-2025.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="page-hero">
  <div class="hero-bg"></div>
  <div class="page-hero-in">
    <span class="badge" id="y-school"></span>
    <h1 id="y-title"></h1>
    <p id="y-blurb"></p>
  </div>
</div>
<nav class="year-nav" id="ynav"></nav>
<div class="page-container wide" id="ybody"></div>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js?v=6"></script>
<script src="assets/js/courses.js?v=6"></script>
<script src="assets/js/site.js?v=6"></script>
<script>

const YEAR = "2024-2025";
function paintPage(){
  const y = COURSES[YEAR];
  document.title = t({fr:"Cours",en:"Courses"}) + " " + YEAR + " · " + DATA.name;
  $("y-school").innerHTML = y.schoolUrl
    ? `<a href="${y.schoolUrl}" target="_blank" rel="noopener">${t(y.school)} ↗</a>` : t(y.school);
  $("y-title").textContent  = t({fr:"Mes cours",en:"My Courses"}) + " \u00b7 " + YEAR;
  $("y-blurb").textContent  = t(y.programme);

  $("ynav").innerHTML = [...COURSES.years].reverse().map(v =>
    `<a href="my-courses-${v}.html" class="${v===YEAR?"active":""}">${v}</a>`).join("");

  let html = `<div class="content-block"><p>${t(y.blurb)}</p>${y.caveat ? `<p class="course-caveat">${t(y.caveat)}</p>` : ""}</div>`;
  if (y.semesters.length){
    html += y.semesters.map(s => `
      <div class="semester-block">
        <h2>${t(s.name)}</h2>
        <p class="sub">${t(y.programme)}</p>
        ${s.courses.map(c => `
          <details class="course-item">
            <summary>${t(c.title)}</summary>
            ${(c.meta || c.grade) ? `<p class="course-meta">${[t(c.meta), c.grade ? (t({fr:"Note",en:"Grade"})+" : "+t(c.grade)) : ""].filter(Boolean).join("  ·  ")}</p>` : ""}
            <ul>${(t(c.content) || t(c.topics) || []).map(x=>`<li>${x}</li>`).join("")}</ul>
          </details>`).join("")}
      </div>`).join("");
  }
  if (y.todo) html += `<div class="placeholder-note">${t(y.todo)}</div>`;
  if (y.note) html += `<div class="placeholder-note" style="margin-top:18px">${t(y.note)}</div>`;
  $("ybody").innerHTML = html;
}

</script>
</body>
</html>
