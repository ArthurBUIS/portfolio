<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Professional Projects · Arthur Buis</title>
<meta name="description" content="Professional projects by Arthur Buis, real-time vision, medical NLP, leadership.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=18">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="page-hero pro">
  <div class="hero-bg"></div>
  <div class="page-hero-in">
    <h1 id="pp-title"></h1>
    <p id="pp-sub"></p>
  </div>
</div>
<div class="page-container" id="prolist"></div>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js?v=7"></script>
<script src="assets/js/site.js?v=11"></script>
<script>

function paintPage(){
  document.title = t({fr:"Projets professionnels",en:"Professional Projects"}) + " · " + DATA.name;
  $("pp-title").textContent = t({fr:"Projets professionnels",en:"Professional Projects"});
  $("pp-sub").textContent   = t({fr:"Projets et contributions clés.",en:"Key projects and contributions."});

  const L = {
    tools:         { fr: "Outils & technologies", en: "Tools & technologies" },
    contributions: { fr: "Contributions clés", en: "Key contributions" },
    challenges:    { fr: "Défis techniques", en: "Technical challenges" }
  };
  const figure = f => `<figure class="proj-figure"><img src="${f.src}" alt="${t(f.caption) || ""}" loading="lazy">${f.caption ? `<figcaption>${t(f.caption)}</figcaption>` : ""}</figure>`;
  const pill = x => `<span class="tag">${x}</span>`;
  $("prolist").innerHTML = DATA.proProjects.map(p=>{
    const orgTxt = p.orgUrl
      ? `<a href="${p.orgUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t(p.org)}</a>`
      : t(p.org);
    const meta = [orgTxt, t(p.when), p.kind ? t(p.kind) : null].filter(Boolean).join(" &middot; ");
    const contributions = t(p.skills || p.work);
    const tools  = p.tools || p.tags;
    const topics = (p.topics && p.topics.length) ? p.topics : (tools || []).slice(0, 5);
    const figs = p.figures && p.figures.length
      ? (p.figures.length === 1 ? figure(p.figures[0])
         : `<div class="proj-gallery">${p.figures.map(figure).join("")}</div>`)
      : "";
    return `
    <details class="content-block pro-project"${p.slug ? ` id="${p.slug}"` : ""}>
      <summary>
        <span class="pro-icon">${p.icon || ""}</span>
        <h2>${t(p.title)}</h2>
        <span class="pro-meta">${meta}</span>
        <span class="pro-desc">${t(p.description || p.summary)}</span>
      </summary>
      <div class="pro-body">
        ${p.challenges ? `<h3>${t(L.challenges)}</h3>
        <p>${t(p.challenges)}</p>` : ""}
        ${figs}
        ${contributions && contributions.length ? `<h3>${t(L.contributions)}</h3>
        <ul>${contributions.map(x=>`<li>${x}</li>`).join("")}</ul>` : ""}
        ${tools && tools.length ? `<h3>${t(L.tools)}</h3>
        <div class="tags">${tools.map(pill).join("")}</div>` : ""}
      </div>
    </details>`;
  }).join("");

  if (location.hash){
    const el = document.querySelector(location.hash);
    if (el && el.tagName === "DETAILS"){
      el.open = true;
      el.scrollIntoView({ block: "start" });
    }
  }
}

</script>
</body>
</html>
