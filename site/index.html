<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arthur Buis · Portfolio</title>
<meta name="description" content="Portfolio of Arthur Buis, Ecole Polytechnique graduate engineer in applied mathematics and computer science, incoming M.Sc. Bioinformatics student at DTU.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=4">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="hero">
  <div class="hero-bg"></div>
  <div class="hero-content">
    <div class="avatar-wrap">
      <div class="ring"></div><div class="ring2"></div>
      <div class="avatar" id="avatar"></div>
    </div>
    <div class="hero-text">
      <h1 id="h-name"></h1>
      <p class="hero-sub" id="h-role"></p>
      <p class="hero-desc" id="h-lede"></p>
      <div class="hero-cta">
        <a class="btn" href="my-cv.html" id="h-cta2"></a>
      </div>
      <div class="hero-stats" id="stats"></div>
    </div>
  </div>
</div>

<div class="nav-cards" id="navcards"></div>

<div class="panel-row">
  <section class="panel panel-white">
    <h2 class="section-title" id="t-exp"></h2>
    <div class="timeline" id="exp"></div>
  </section>

  <section class="panel panel-rose">
    <h2 class="section-title" id="t-edu"></h2>
    <div class="timeline" id="edu"></div>
  </section>
</div>

<section class="panel panel-grey">
  <h2 class="section-title" id="t-skill"></h2>
  <div class="grid" id="skills"></div>
</section>

<section class="panel panel-white">
  <h2 class="section-title" id="t-out"></h2>
  <div class="grid" id="outside"></div>
</section>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js?v=4"></script>
<script src="assets/js/site.js?v=4"></script>
<script>

function paintPage(){
  document.title = DATA.name + " · Portfolio";
  $("avatar").innerHTML = DATA.photo ? `<img src="${DATA.photo}" alt="${DATA.name}">` : DATA.initials;
  "h-name h-role h-lede h-cta2".split(" ").forEach((id,i)=>{
    document.getElementById(id).textContent = t([DATA.name,DATA.role,DATA.lede,DATA.cta2][i]);
  });
  $("t-exp").textContent   = t({fr:"Parcours Professionnel",en:"Professional Experience"});
  $("t-edu").textContent   = t({fr:"Formation",en:"Education"});
  $("t-skill").textContent = t({fr:"Domaines d'Expertise",en:"Areas of Expertise"});
  $("t-out").textContent   = t({fr:"Hors des écrans",en:"Away from the Screen"});

  $("stats").innerHTML = DATA.stats.map(s=>{
    const inner = `<b>${s.v}</b><span>${t(s)}</span>`;
    return s.href ? `<a class="stat" href="${s.href}">${inner}</a>` : `<div class="stat">${inner}</div>`;
  }).join("");

  $("navcards").innerHTML = DATA.navcards.map(c=>`
    <a class="nav-card ${c.cls}" href="${c.href}">
      <div class="card-bg"></div>
      <div class="card-content">
        <span class="card-icon">${c.icon}</span>
        <h3>${t(c.title)}</h3>
        <p>${t(c.desc)}</p>
        <span class="card-arrow">&rarr;</span>
      </div>
    </a>`).join("");

  const tl = list => list.map(i=>`
    <article class="tl-item">
      ${i.page ? `<a class="tl-card-link" href="${i.page}" aria-label="${esc(t(i.role))}"></a>` : ""}
      <div class="tl-when"><span class="tl-icon">${i.icon}</span><span class="when">${t(i.when)}</span></div>
      <div class="tl-body">
        <h3>${t(i.role)}</h3>
        <h4>${i.link ? `<a class="tl-org" href="${i.link}" target="_blank" rel="noopener">${t(i.org)}</a>` : t(i.org)}</h4>
        <p>${t(i.desc)}</p>
      </div>
    </article>`).join("");
  $("exp").innerHTML = tl(DATA.experience);
  $("edu").innerHTML = tl(DATA.education);

  const cards = list => list.map(s=>`
    <div class="card centered">
      <span class="emoji">${s.icon}</span>
      <h4>${t(s.title)}</h4>
      <p>${t(s.items)}</p>
      <span class="rule"></span>
    </div>`).join("");
  $("skills").innerHTML  = cards(DATA.skills);
  $("outside").innerHTML = cards(DATA.outside);
}

/* hero background: a viridis heatmap, the figure every genomics workflow produces */
const VIRIDIS = ["#3E4A89","#31688E","#26828E","#1F9E89","#35B779","#6ECE58"];
function buildMatrix(){
  const el = document.querySelector(".hero-bg");
  if (!el) return;
  const cols = window.innerWidth < 880 ? 20 : 36, rows = 12;
  el.style.display = "grid";
  el.style.gap = "2px";
  el.style.gridTemplateColumns = `repeat(${cols},1fr)`;
  el.style.gridTemplateRows = `repeat(${rows},1fr)`;
  let html = "";
  for (let i = 0; i < cols * rows; i++){
    const r = Math.floor(i / cols), c = i % cols;
    const v = (Math.sin(c * .38) + Math.cos(r * .55) + Math.sin((c + r) * .21)) / 3;
    const idx = Math.max(0, Math.min(5, Math.round((v + 1) * 2.6)));
    html += `<i style="background:${VIRIDIS[idx]};animation-delay:${((c * 7 + r * 13) % 70) / 10}s"></i>`;
  }
  el.innerHTML = html;
}
let mrz; addEventListener("resize", () => { clearTimeout(mrz); mrz = setTimeout(buildMatrix, 200); });
buildMatrix();

</script>
</body>
</html>
