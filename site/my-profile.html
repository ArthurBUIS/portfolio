<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile — Arthur Buis</title>
<meta name="description" content="Profile of Arthur Buis — background, experience, education and skills.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="page-hero">
  <div class="page-hero-in">
    <span class="badge" id="p-badge"></span>
    <h1 id="p-title"></h1>
    <p id="p-sub"></p>
  </div>
</div>
<div class="page-container" id="profile"></div>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>

function paintPage(){
  document.title = t({fr:"Profil",en:"Profile"}) + " — " + DATA.name;
  $("p-badge").textContent = t({fr:"À propos",en:"About"});
  $("p-title").textContent = DATA.name;
  $("p-sub").textContent   = t(DATA.role);

  const li = a => a.map(x=>`<li>${x}</li>`).join("");
  $("profile").innerHTML = `
    <div class="content-block">
      <h2>${t({fr:"Qui je suis",en:"About Me"})}</h2>
      <p>${t(DATA.lede)}</p>
      <p>${t({fr:"Mon travail se situe à l'intersection des mathématiques appliquées et de l'informatique : construire des modèles qui tiennent la route sur des données réelles, et les amener jusqu'à un système qui tourne. La bioinformatique est la suite logique — c'est un domaine où la qualité de la modélisation compte autant que la qualité du code.",
                 en:"My work sits at the intersection of applied mathematics and computer science: building models that hold up on real data, and taking them through to a system that runs. Bioinformatics is the logical next step — a field where the quality of the modelling matters as much as the quality of the code."})}</p>
    </div>

    <div class="content-block">
      <h2>${t({fr:"Expérience",en:"Experience"})}</h2>
      <ul>${li(DATA.experience.map(e=>`<strong>${t(e.role)}</strong> — ${t(e.org)}, ${t(e.when)}`))}</ul>
    </div>

    <div class="content-block">
      <h2>${t({fr:"Formation",en:"Education"})}</h2>
      <ul>${li(DATA.education.map(e=>`<strong>${t(e.role)}</strong> — ${t(e.org)}, ${t(e.when)}`))}</ul>
    </div>

    <div class="content-block">
      <h2>${t({fr:"Compétences",en:"Skills"})}</h2>
      ${DATA.skills.map(s=>`<h3>${s.icon} ${t(s.title)}</h3><p>${t(s.items)}</p>`).join("")}
    </div>

    <div class="content-block">
      <h2>${t({fr:"Hors des écrans",en:"Away from the Screen"})}</h2>
      ${DATA.outside.map(o=>`<h3>${o.icon} ${t(o.title)}</h3><p>${t(o.items)}</p>`).join("")}
    </div>

    <div class="content-block">
      <h2>${t({fr:"Me contacter",en:"Get in Touch"})}</h2>
      <p>${t(DATA.contact_lede)}</p>
      <p><a class="btn" href="mailto:${DATA.email}">${DATA.email}</a></p>
    </div>`;
}

</script>
</body>
</html>
