<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>About · Arthur Buis</title>
<meta name="description" content="About Arthur Buis, École Polytechnique graduate engineer, M.Sc. Bioinformatics student at DTU, working towards a career in AI for healthcare.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="page-hero">
  <div class="page-hero-in about-hero">
    <span class="eyebrow" id="a-eyebrow"></span>
    <h1 id="a-heading"></h1>
    <p class="about-tagline" id="a-tagline"></p>
    <div class="about-id">
      <div class="about-name" id="a-name"></div>
      <div class="about-role" id="a-role"></div>
    </div>
    <div class="about-facts" id="a-facts"></div>
  </div>
</div>

<div class="page-container about" id="about"></div>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js"></script>
<script src="assets/js/site.js"></script>
<script>

function paintPage(){
  const P = DATA.profile;
  document.title = t({fr:"À propos",en:"About"}) + " · " + DATA.name;

  $("a-eyebrow").textContent = t(P.eyebrow);
  $("a-heading").textContent = t(P.heading);
  $("a-tagline").textContent = t(P.tagline);
  $("a-name").textContent    = DATA.name;
  $("a-role").textContent    = t(P.roleShort);

  $("a-facts").innerHTML = P.facts.map(f => `
    <div class="fact">
      <span class="fact-ic">${f.icon}</span>
      <span class="fact-txt">
        <span class="fact-label">${t(f.label)}</span>
        <span class="fact-value">${t(f.value)}</span>
      </span>
    </div>`).join("");

  const section = (s, extra = "") => `
    <section class="about-section">
      <span class="eyebrow">${t(s.eyebrow)}</span>
      ${s.title ? `<h2>${t(s.title)}</h2>` : ""}
      ${s.body ? `<p>${t(s.body)}</p>` : ""}
      ${extra}
    </section>`;

  const choices = `
    <div class="choice-grid">${P.choices.items.map(c => `
      <article class="choice">
        <span class="choice-ic">${c.icon}</span>
        <h3>${t(c.title)}</h3>
        <p class="choice-sub">${t(c.sub)}</p>
        <p>${t(c.body)}</p>
      </article>`).join("")}
    </div>`;

  const cvLabel   = t({fr:"Voir mon CV", en:"View my CV"});
  const projLabel = t({fr:"Mes projets", en:"My projects"});
  const closing = `
    <section class="about-section about-closing">
      <span class="eyebrow">${t(P.closing.eyebrow)}</span>
      <p>${t(P.closing.body)}</p>
      <div class="about-cta">
        <a class="btn" href="my-cv.html">${cvLabel}</a>
        <a class="btn btn-line" href="my-projects.html">${projLabel} &rarr;</a>
      </div>
    </section>`;

  $("about").innerHTML = section(P.story) + section(P.choices, choices) + closing;
}

</script>
</body>
</html>
