<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multi-objective Optimisation of Urban Trail Routes · Arthur Buis</title>
<meta name="description" content="Academic project by Arthur Buis: Multi-objective Optimisation of Urban Trail Routes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css?v=8">
</head>
<body>
<header class="site-header" data-chrome="header"></header>

<div class="page-hero">
  <div class="hero-bg"></div>
  <div class="page-hero-in">
    <span class="badge" id="d-when"></span>
    <h1 id="d-title"></h1>
    <p id="d-summary"></p>
  </div>
</div>
<div class="page-container" id="detail"></div>
<footer class="site-footer" data-chrome="footer"></footer>
<script src="assets/js/data.js?v=6"></script>
<script src="assets/js/site.js?v=6"></script>
<script>

const SLUG = "urban-trail-optimisation";
function paintPage(){
  const p = DATA.projects.find(x => x.slug === SLUG);
  document.title = t(p.title) + " · " + DATA.name;
  $("d-when").textContent    = t(p.when);
  $("d-title").textContent   = p.icon + " " + t(p.title);
  $("d-summary").textContent = t(p.summary);
  const back = `<p><a class="btn" href="my-projects.html">&larr; ${t({fr:"Tous les projets",en:"All projects"})}</a></p>`;
  if (Array.isArray(p.body) && p.body.length){
    $("detail").innerHTML = projectHighlights(p) + projectBody(p.body) + back;
  } else {
    $("detail").innerHTML = `
    <div class="content-block">
      <h2>${t({fr:"Le problème",en:"The problem"})}</h2>
      <p>${t(p.context)}</p>
    </div>
    <div class="content-block">
      <h2>${t({fr:"Ce que j'ai fait",en:"What I did"})}</h2>
      <ul>${t(p.work).map(x=>`<li>${x}</li>`).join("")}</ul>
    </div>` + back;
  }
}

</script>
</body>
</html>
